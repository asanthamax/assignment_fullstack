services:
  backend:
    build: .
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/sql_app.db
    volumes:
      - db-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db-data:
